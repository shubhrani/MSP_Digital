<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furnace Process Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__mark">FE</span>
    <div class="topbar__title">
      <h1>Furnace Process Monitor</h1>
      <p>Pick a furnace to view</p>
    </div>
  </div>
</header>

<main class="home-layout">
  {% for f in furnaces %}
  <a class="card home-card" href="{{ url_for('dashboard', slug=f.slug) }}">
    <div class="card__eyebrow">Dashboard</div>
    <div class="home-card__name">{{ f.name }}</div>
    <div class="home-card__cta">View live feed &amp; heat history &rarr;</div>
  </a>
  {% endfor %}
</main>

</body>
</html>
